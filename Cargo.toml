[package]
name = "op-cache"
version = "0.3.1"
edition = "2021"
description = "A fast caching proxy for 1Password CLI op read commands"
license = "MIT"

[dependencies]
# Single-threaded runtime (rt, not rt-multi-thread) for fast CLI startup
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "process", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde-saphyr = "2"
moka = { version = "0.12", features = ["future"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
blake3 = "1"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
fork = "0.11"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
